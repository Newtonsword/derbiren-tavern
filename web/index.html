<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小魔王地下城 · 在线版</title>
<!-- PWA -->
<meta name="theme-color" content="#231e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小魔王地下城">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
:root {
  --bg: #1a1410; --panel: #231e1a; --border: #3a3028; --text: #d4c5b2;
  --dim: #8a7a6a; --accent: #c44b3c; --accent-glow: #e85d4a; --gold: #c9a050;
  --good: #5a9e4b; --input-bg: #1e1914; --msg-user: #2a2520; --msg-gm: #1e1c18;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei",sans-serif;
  background: var(--bg); color: var(--text);
  height: 100dvh; display:flex; justify-content:center;
}
#app {
  width:100%; max-width:900px; height:100dvh;
  display:flex; flex-direction:column; background:var(--panel);
  border-left:1px solid var(--border); border-right:1px solid var(--border);
}

/* ── 遮罩界面（设置/建城）── */
.overlay {
  position:fixed; inset:0; z-index:3000; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  padding:20px; overflow-y:auto;
}
.overlay.hidden { display:none; }
.overlay-card {
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:24px; width:100%; max-width:560px;
}
.overlay-card h1 { color:var(--gold); font-size:20px; margin-bottom:20px; text-align:center; }
.overlay-card h2 { color:var(--gold); font-size:16px; margin:18px 0 10px; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
.field input, .field select, .field textarea {
  width:100%; padding:10px 12px; font-size:16px;
  background:var(--input-bg); color:var(--text);
  border:1px solid var(--border); border-radius:8px; font-family:inherit;
}
.field textarea { resize:vertical; min-height:70px; }
.btn {
  width:100%; padding:13px; font-size:16px; border:none; border-radius:8px;
  background:var(--accent); color:#fff; cursor:pointer; font-family:inherit;
  transition:.15s;
}
.btn:hover { background:var(--accent-glow); }
.btn.secondary { background:#3a3028; }
.hint { font-size:12px; color:var(--dim); margin-top:6px; line-height:1.5; }
.link { color:var(--gold); text-decoration:underline; cursor:pointer; }

/* ── 主界面 ── */
.topbar {
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  border-bottom:1px solid var(--border); background:#1c1814;
}
.topbar .title { font-size:14px; color:var(--gold); font-weight:bold; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .ver { font-size:10px; color:var(--dim); }
.top-btn { padding:8px 10px; font-size:13px; border:1px solid var(--border); border-radius:6px;
  background:var(--input-bg); color:var(--text); cursor:pointer; }
#chat-log {
  flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px;
  scroll-behavior:smooth;
}
.msg { font-size:15px; line-height:1.65; }
.msg .body { padding:10px 12px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
.msg.gm .body { background:var(--msg-gm); border:1px solid var(--border); }
.msg.user { align-self:flex-end; }
.msg.user .body { background:var(--msg-user); border:1px solid var(--border); }
.msg.sys { align-self:center; }
.msg.sys .body { background:transparent; color:var(--gold); font-size:12px; border:none; }
.msg .opt { margin-top:4px; padding:4px 0; }
.msg .opt button {
  display:block; width:100%; text-align:left; margin:4px 0; padding:8px 12px;
  background:var(--input-bg); border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-size:14px; cursor:pointer; font-family:inherit; line-height:1.4;
}
.msg .opt button:hover { border-color:var(--accent); color:var(--accent-glow); }

#input-area {
  display:flex; padding:10px 12px; gap:8px; border-top:1px solid var(--border);
  background:#1c1814; padding-bottom:calc(10px + env(safe-area-inset-bottom));
}
#input-area input {
  flex:1; padding:10px 12px; font-size:16px; background:var(--input-bg); color:var(--text);
  border:1px solid var(--border); border-radius:8px; font-family:inherit;
}
#input-area button {
  padding:10px 16px; font-size:15px; border:none; border-radius:8px;
  background:var(--accent); color:#fff; cursor:pointer;
}
#input-area button:disabled { opacity:.5; cursor:not-allowed; }

.statusbar {
  display:flex; align-items:center; gap:8px; padding:6px 12px;
  font-size:11px; color:var(--dim); border-top:1px solid var(--border); background:var(--panel);
}
.statusbar .nsfw { padding:2px 8px; border-radius:10px; border:1px solid var(--border); cursor:pointer; }
.statusbar .nsfw.on { color:#fff; background:var(--accent); border-color:var(--accent); }
.statusbar .spacer { flex:1; }
</style>
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <div class="topbar">
    <span class="title">小魔王地下城 · 在线版</span>
    <button class="top-btn" id="btn-save" title="存档会保存到本浏览器">存档</button>
    <button class="top-btn" id="btn-settings">⚙️</button>
    <span class="ver" id="app-ver"></span>
  </div>

  <!-- 聊天区 -->
  <div id="chat-log"></div>

  <!-- 输入区 -->
  <div id="input-area">
    <input id="chat-input" placeholder="输入行动…" autocomplete="off" />
    <button id="btn-send">发送</button>
  </div>

  <!-- 状态栏 -->
  <div class="statusbar">
    <span id="status-text">未连接</span>
    <span class="spacer"></span>
    <span class="nsfw" id="nsfw-toggle" title="切换成人内容开关">🔞 关</span>
  </div>
</div>

<!-- 设置遮罩 -->
<div class="overlay" id="ov-settings">
  <div class="overlay-card">
    <h1>⚙️ 游戏设置</h1>
    <div class="field">
      <label>DeepSeek API Key</label>
      <input type="password" id="set-key" placeholder="sk-...（存本浏览器，仅直连用）" />
      <div class="hint">Key 只存在你自己浏览器的 localStorage 里，每次调用直连 DeepSeek 官方 API，不经过任何第三方。可到 <a class="link" target="_blank" rel="noopener" href="https://platform.deepseek.com/">platform.deepseek.com</a> 获取。</div>
    </div>
    <div class="field">
      <label>模型</label>
      <select id="set-model">
        <option value="deepseek-chat">deepseek-chat（推荐）</option>
        <option value="deepseek-reasoner">deepseek-reasoner</option>
      </select>
    </div>
    <div class="field">
      <label>游戏世界观</label>
      <textarea id="set-world" placeholder="留空用默认世界观"></textarea>
    </div>
    <button class="btn" id="btn-settings-save">保存</button>
    <div style="height:10px"></div>
    <button class="btn secondary" id="btn-settings-close">返回</button>
  </div>
</div>

<!-- 建城遮罩 -->
<div class="overlay" id="ov-setup">
  <div class="overlay-card">
    <h1>🏰 成为第一位魔王</h1>
    <div class="field">
      <label>你的称呼</label>
      <input id="set-pname" placeholder="小魔王" />
    </div>
    <div class="field">
      <label>初始魔物</label>
      <select id="set-char">
        <option value="猫龙">猫龙（精英，灵活与力量兼备）</option>
        <option value="史莱姆">史莱姆（软萌，刚开始学走路）</option>
        <option value="哥布林">哥布林（狡猾，机灵）</option>
        <option value="狼">狼（敏捷，警觉）</option>
        <option value="触手怪">触手怪（神秘，触手能干活）</option>
      </select>
    </div>
    <label style="font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px;margin:4px 0 12px;">
      <input type="checkbox" id="set-nsfw-start" /> 开启成人内容（NSFW）
    </label>
    <button class="btn" id="btn-start">开始游戏</button>
  </div>
</div>

<script src="./api.js"></script>
<script>
const MDT = window.MDT;
const $ = (id) => document.getElementById(id);
document.getElementById('app-ver').textContent = MDT.APP_VERSION;

/* ── 状态 ── */
let game = MDT.loadGame();
let settings = MDT.loadSettings();
let history = [];          // [{role, content}]
let busy = false;

/* 初始 state 是否允许直接进主界面 */
function isReady() {
  return game && game.started && settings.key;
}

/* ── UI 组件 ── */
function addMsg(role, text, opts) {
  const log = $('chat-log');
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  wrap.appendChild(body);
  if (opts && opts.length) {
    const odiv = document.createElement('div');
    odiv.className = 'opt';
    opts.forEach((o) => {
      const b = document.createElement('button');
      b.textContent = o;
      b.onclick = () => { $('chat-input').value = o; send(); };
      odiv.appendChild(b);
    });
    wrap.appendChild(odiv);
  }
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

/* 渲染历史到聊天区 */
function renderHistory() {
  $('chat-log').innerHTML = '';
  history.forEach((m) => {
    if (m.role === 'user') addMsg('user', m.content);
    else if (m.role === 'assistant') addGMMsg(m.content);
  });
}

function setStatus(t) { $('status-text').textContent = t; }
function setBusy(v) {
  busy = v; $('btn-send').disabled = v;
  $('chat-input').disabled = v;
  if (!v) $('chat-input').focus();
}

/* ── NSFW 开关 ── */
function nsfwState() {
  const on = !!settings.nsfw;
  const el = $('nsfw-toggle');
  el.classList.toggle('on', on);
  el.textContent = on ? '🔞 开' : '🔞 关';
}
$('nsfw-toggle').onclick = () => {
  settings.nsfw = !settings.nsfw;
  MDT.saveSettings(settings);
  nsfwState();
  if (history.length === 0) {
    // 干扰按钮已点击过时告知
  }
};

/* ── 生成队伍文本 ── */
function rosterText() {
  if (!game || !game.char) return '（暂无队伍）';
  const c = game.char;
  let t = `- ${c.name}（${c.species}）——你的第一只魔物`;
  if (c.desc) t += `：${c.desc}`;
  return t;
}

/* ── 发送 ── */
async function send() {
  if (busy) return;
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  history.push({ role: 'user', content: text });
  addMsg('user', text);
  setBusy(true);
  setStatus('GM 思考中…');
  try {
    const cfg = {
      nsfw: settings.nsfw,
      model: settings.model || 'deepseek-chat',
      world: settings.world || MDT.DEFAULT_WORLD,
      playerName: game ? game.pname : '小魔王',
      charName: game ? game.char.name : '',
      charSpecies: game ? game.char.species : '',
      roster: rosterText()
    };
    const reply = await MDT.callDeepSeek(settings.key, history, cfg);
    history.push({ role: 'assistant', content: reply });
    addGMMsg(reply);
    saveGame(game);
    setStatus('已连接');
  } catch (e) {
    addMsg('sys', '⚠️ ' + e.message);
    setStatus('出错');
  } finally {
    setBusy(false);
  }
}

/* ── 选项解析（复用主版逻辑）── */
function parseChoices(text) {
  const marker = /(?:现在你可以[：:]|你可以[：:]|请选择[：:]|行动选项[：:])/;
  const idx = text.search(marker);
  if (idx === -1) return { narrative: text, choices: [] };
  const narrative = text.substring(0, idx).trim();
  const rest = text.substring(idx);
  const choiceRegex = /[-•*]?\s*\*\*(.+?)\*\*\s*[，,。.]?\s*(.*?)(?=\n|$)/g;
  const choices = [];
  let m;
  while ((m = choiceRegex.exec(rest)) !== null) {
    const label = m[1].trim();
    const desc = m[2].trim();
    if (label) choices.push({ label, desc, full: desc ? `${label}——${desc}` : label });
  }
  return { narrative, choices };
}

/* 渲染 GM 消息（拆段 + 可点选项） */
function addGMMsg(text) {
  const { narrative, choices } = parseChoices(text);
  if (narrative) addMsg('gm', narrative);
  if (choices && choices.length) {
    const log = $('chat-log');
    const wrap = document.createElement('div');
    wrap.className = 'msg gm';
    const odiv = document.createElement('div');
    odiv.className = 'opt';
    choices.forEach((c) => {
      const b = document.createElement('button');
      b.textContent = c.full;
      b.onclick = () => { $('chat-input').value = c.full; send(); };
      odiv.appendChild(b);
    });
    wrap.appendChild(odiv);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }
}

/* 回车发送 */
$('chat-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
$('btn-send').onclick = send;

/* ── 新游戏 ── */
function startNewGame() {
  if (!settings.key) { showSettings(); return; }
  $('ov-setup').classList.remove('hidden');
}
function confirmStart() {
  const pname = $('set-pname').value.trim() || '小魔王';
  const species = $('set-char').value;
  const nsfw = $('set-nsfw-start').checked;
  const names = { '猫龙':'焰爪','史莱姆':'软软','哥布林':'尖牙','狼':'灰瞳','触手怪':'幽幽' };
  const descs = { '猫龙':'傲娇又忠诚，皮光溜滑的小猫龙。','史莱姆':'一滩软萌的蓝色小黏液，什么都愿意学着试。','哥布林':'兜着耳朵的机灵小鬼，眼珠滴溜溜转。','狼':'灰黑的小狼崽，警觉地竖着耳朵。','触手怪':'一坨墨色的软体怪，细触手好奇地探来探去。' };
  game = {
    started: true, pname, dopBonus: 0,
    char: { name: names[species], species, desc: descs[species] },
    created: Date.now()
  };
  history = [{ role: 'user', content: '[START] 新世界开始' }];
  saveGame(game);
  $('ov-setup').classList.add('hidden');
  enterGame();
  send(); // 触发开场叙事
}
$('btn-start').onclick = confirmStart;
$('ov-setup').addEventListener('click', (e) => { if (e.target === $('ov-setup')) $('ov-setup').classList.add('hidden'); });

/* ── 设置 ── */
function showSettings() {
  if ($('ov-settings').classList.contains('hidden')) $('ov-settings').classList.remove('hidden');
}
$('btn-settings').onclick = () => { $('set-key').value = settings.key || ''; $('set-model').value = settings.model || 'deepseek-chat'; $('set-world').value = settings.world || ''; showSettings(); };
$('btn-settings-save').onclick = () => {
  settings.key = $('set-key').value.trim();
  settings.model = $('set-model').value;
  settings.world = $('set-world').value.trim();
  MDT.saveSettings(settings);
  $('ov-settings').classList.add('hidden');
  setStatus('已保存');
  if (!game || !game.started) { $('ov-setup').classList.remove('hidden'); }
};
$('btn-settings-close').onclick = () => { $('ov-settings').classList.add('hidden'); };
$('btn-save').onclick = () => { saveGame(game); addMsg('sys', '已存档到本浏览器'); };

/* ── 启动 ── */
function enterGame() {
  document.querySelectorAll('.overlay').forEach((o) => o.classList.add('hidden'));
  renderHistory();
  nsfwState();
  setStatus(settings.key ? '已连接' : '未设置 API Key');
}

if (isReady()) {
  history = [{ role: 'user', content: '[START] 继续游戏' }];
  // 预设一段开场,让 GM 续写
  history = []; // 无法拿回首轮 GM 回复, 用本地占位提示
  addMsg('gm', '欢迎回来，魔王。地下城仍在，魔物仍在等你。输入任意内容继续你的征伐，或输入指令推进剧情。');
  setStatus('已连接'); nsfwState();
} else {
  showSettings();
}
</script>
</body>
</html>
